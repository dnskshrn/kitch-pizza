name: Expire bonuses cron

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire-bonuses endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in GitHub repository secrets"
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            "https://losos.md/api/cron/expire-bonuses"
